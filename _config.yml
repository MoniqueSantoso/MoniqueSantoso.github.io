title: "Your Name"
description: "PhD Candidate · Your Department · Your University"
url: "https://yourusername.github.io"
baseurl: ""   # leave empty if your repo is yourusername.github.io

# ── Personal info ──────────────────────────
author:
  name: "Your Name"
  title: "PhD Candidate in Your Field"
  institution: "Your University"
  email: "you@university.edu"
  google_scholar: "https://scholar.google.com"   # full URL
  linkedin: "https://linkedin.com/in/yourhandle"
  github: "https://github.com/yourusername"
